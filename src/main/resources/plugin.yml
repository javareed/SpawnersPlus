name: SpawnersPlus
prefix: 'SpawnersPlus'
version: 1.5.1
main: dev.reed.spawners.SpawnersPlus
api-version: '1.21.11'
depend: [Vault]
description: Stack spawners and collect money instead of spawning mobs.
commands:
  spawners:
    description: Give spawners or edit the spawner you are looking at.
    usage: /spawners
    aliases: [spawnersplus]
permissions:
  spawnersplus.use:
    default: true
  spawnersplus.admin:
    default: op
